# Ulanzi D200 Stream Deck configuration mapping
# Button indices range from 0 to 12.

# ==============================================================================
# GLOBAL UI SETTINGS
# ==============================================================================
# font_size_label:
#   Font size used for the top label of the buttons.
#   Value: Any positive integer (e.g., 12 for default, 30 for extra large).
#
# font_size_status:
#   Font size used for the bottom status text of the buttons.
#   Value: Any positive integer (e.g., 10 for default, 30 for extra large).
#
# margin_label:
#   Top margin offset in pixels to position the top label text.
#   Value: Any integer (default: 10).
#
# margin_status:
#   Bottom margin offset in pixels (from bottom up) to position the status text.
#   Value: Any integer (default: 25, 45 for large fonts to prevent cutoffs).
#
# small_window_mode:
#   Custom display layout mode for the Ulanzi D200 small LCD information screen.
#   Values:
#     - 0: STATS mode (renders a clean system/statistics overview)
#     - 1: CLOCK mode (keeps default watchface on Ulanzi screen)
#     - 2: BACKGROUND mode (renders custom background template)
#
# state_sync_interval:
#   Background polling interval in seconds to sync device states from the Hue Bridge.
#   Value: Any positive integer (default: 5).
#
# screen_sleep_start:
#   Time of day to start automatically turning off the screen (in HH:MM format).
#   Value: String (e.g., "22:00" for 10 PM), or "" to disable scheduled sleep.
#
# screen_sleep_end:
#   Time of day to stop automatically turning off the screen (in HH:MM format).
#   Value: String (e.g., "07:00" for 7 AM), or "" to disable scheduled sleep.
#
# screen_sleep_timeout:
#   Inactivity duration in seconds before turning off screen backlight automatically.
#   Value: Positive integer (default: 300 for 5 minutes), or 0 to disable inactivity sleep.
#
# pc_monitor_port:
#   UDP port to listen for incoming Windows PC telemetry performance statistics packets.
#   Value: Positive integer between 1 and 65535 (default: 9999).
# ==============================================================================

font_size_label: 30     # Font size for the top label (default: 12)
font_size_status: 30    # Font size for the bottom status text (default: 10)
margin_label: 10        # Top margin for the label (default: 10)
margin_status: 60       # Bottom margin for the status text (default: 25)
small_window_mode: 1    # Small screen mode: 0 for Stats, 1 for Clock, 2 for Background
state_sync_interval: 5  # Polling interval in seconds to sync device states from bridge (default: 5)
screen_sleep_start: "23:59"   # Start of screen sleep window (default: "22:00")
screen_sleep_end: "07:00"     # End of screen sleep window (default: "07:00")
screen_sleep_timeout: 300     # Inactivity timeout in seconds before sleep (default: 300)
pc_monitor_mode: "pull"       # PC monitor mode: "pull" (LibreHardwareMonitor HTTP) or "push" (UDP broadcast)
pc_monitor_ip: "192.168.31.101" # Replace with your Windows PC IP address (e.g. 192.168.31.X)
pc_monitor_port: 8085         # Port of LibreHardwareMonitor Web Server (default: 8085)

# ==============================================================================
# BUTTON MAPPINGS
# ==============================================================================
# Each button configuration under the 'buttons' list supports the following attributes:
#
# - index:
#     The physical key index on the Ulanzi D200 Stream Deck.
#     Value: Integer from 0 to 12.
#
# - device_type:
#     The category/class of the device mapped to this button.
#     Values:
#       - "light" : Philips Hue smart lights (bulbs, LED strips, etc.)
#       - "plug"  : Philips Hue smart plugs (on/off appliances)
#       - "widget": Interactive system/utility components (like a clock)
#
# - action_type:
#     The action to execute when the button is pressed.
#     Values:
#       - "hue_toggle": Toggle power state of a Philips Hue light or smart plug (requires 'target')
#       - "clock"     : Toggle display of high-precision current time/date widget
#       - "pc_monitor": Toggle display of Windows PC performance stats (CPU, GPU, RAM, Disk)
#       - "weather"   : Display current weather (temperature, chance of precipitation, and graphics)
#       - "weather_forecast"   : Display today's weather forecast (min/max temperature)
#       - "weather_forecast+1" : Display tomorrow's weather forecast (min/max temperature)
#
# - target:
#     The unique ID of the target device on the local Philips Hue Bridge.
#     Value: String representing bridge light index (e.g., "1", "2").
#     *Not required when action_type is "clock", "pc_monitor", "weather", "weather_forecast", or "weather_forecast+1".
#
# - label:
#     Text label shown at the top of the button key face.
#     Value: Any string (e.g., "Time", "Ceiling Light").
#
# - icon:
#     Local path to a customized PNG icon file to overlay on the button center,
#     or a dynamic shape keyword to draw geometric icons if no physical file exists.
#     Values:
#       - Valid path relative to streamdeck folder (e.g., "assets/icons/clock.png")
#       - Dynamic shape keywords: "light", "plug", "ceiling", "lamp", "3dprinter", "clock", "pc_monitor", "cpu", "gpu", "ram", "disk"
# ==============================================================================

buttons:
  - index: 0
    device_type: "light"
    action_type: "hue_toggle"
    target: "5"  # Replace with your actual Philips Hue Bulb ID
    label: "Luz Teto"
    icon: "ceiling"

  - index: 1
    device_type: "light"
    action_type: "hue_toggle"
    target: "2"  # Replace with your actual Philips Hue Bulb ID
    label: "Luz Mesa"
    icon: "lamp"

  - index: 2
    device_type: "plug"
    action_type: "hue_toggle"
    target: "6"  # Replace with your actual Philips Hue Smart Plug ID
    label: "Monitor"
    icon: "plug"

  - index: 4
    device_type: "plug"
    action_type: "hue_toggle"
    target: "7"  # Replace with your actual Philips Hue Smart Plug ID
    label: "Impressora 3D"
    icon: "3dprinter"

  - index: 9
    device_type: "widget"
    action_type: "pc_monitor"
    label: "PC Stats"
    icon: "pc_monitor"

  - index: 10
    device_type: "widget"
    action_type: "weather_forecast"
    label: "Hoje"

  - index: 11
    device_type: "widget"
    action_type: "weather_forecast+1"
    label: "Amanha"

  - index: 12
    device_type: "widget"
    action_type: "weather"
    label: "Agora"
